name: Publish
on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # Pin must resolve to a finsys-core commit whose reusable workflow strips
    # the legacy `always-auth` key: setup-node writes that key whenever
    # registry-url is set, npm 12 removed the key, and the strict-npmrc
    # baseline turns the old warning into a hard error (EUNKNOWNCONFIG),
    # failing every publish from this repo.
    uses: ExtraGalaxies/finsys-core/.github/workflows/npm-package-publish.yml@2a346a7bef0f3f153756fe0d64c7334a9d30069c
